name: VisionaryBrains validation

on:
  pull_request:
    branches:
      - experiment/visionarybrains
    paths:
      - 'experiments/visionarybrains/index.html'
      - 'experiments/visionarybrains/app.js'
      - 'experiments/visionarybrains/styles.css'
      - 'experiments/visionarybrains/package.json'
      - 'experiments/visionarybrains/README.md'
      - 'experiments/visionarybrains/assets/**'
      - 'experiments/visionarybrains/tests/**'
      - 'experiments/visionarybrains/lane-status/builder.json'
      - '.github/workflows/visionarybrains-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate VisionaryBrains public shell
        working-directory: experiments/visionarybrains
        run: npm run validate
