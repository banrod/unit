name: VisionaryBrains validation

on:
  pull_request:
    branches:
      - experiment/visionarybrains
    paths:
      - 'experiments/visionarybrains/**'
      - '.github/workflows/visionarybrains-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public teaching site
        working-directory: experiments/visionarybrains
        run: node tests/validate.mjs
